name: profile-assets

# Generates every dynamic image of the profile README (contribution snake,
# stats, top languages, streak) and publishes them on the `output` branch.
# The README only references files from that branch, so it no longer depends
# on public third-party instances that get paused or rate limited.

on:
  schedule:
    # Off-peak minute on purpose: runs queued at the top of the hour can be
    # delayed or dropped when GitHub Actions is under heavy load.
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

env:
  # Optional: add a personal access token as the PROFILE_STATS_TOKEN secret
  # (scopes: repo, read:user) to include private repositories. Without it the
  # default token is used and only public activity is counted.
  STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#216e39
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ff41

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=chartreuse-dark&hide_border=true&bg_color=0d1117
          path: dist/stats.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=chartreuse-dark&hide_border=true&bg_color=0d1117&exclude_repo=100DaysOfCode,Data_Engineer
          path: dist/top-langs.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=0d1117&ring=00ff41&fire=00ff41&currStreakLabel=00ff41
          path: dist/streak.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
